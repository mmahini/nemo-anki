services:
  - type: web
    name: nemo-anki-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    # Schema-bootstrap so we can share one Postgres with the sibling
    # projects: settings.py pins search_path to DATABASE_SCHEMA (no `public`
    # fallback), so the schema must exist before the first migrate.
    buildCommand: |
      pip install -r requirements.txt
      python -c "import os,psycopg; s=os.environ['DATABASE_SCHEMA'].strip(); c=psycopg.connect(os.environ['DATABASE_URL']); c.autocommit=True; c.execute(f'CREATE SCHEMA IF NOT EXISTS \"{s}\"'); print('schema',repr(s),'ready')"
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py createsuperuser --noinput || true
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: nemo-anki-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://anki.nemoapps.xyz,https://nemo-anki.vercel.app,https://nemo-anki-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nemo-anki-backend.onrender.com
      # Shared Postgres with the other mmahini projects — sync: false so the
      # value is set once via the Render dashboard, not from this file.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: nemo_anki
      # Gemini powers the Import flow.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Resend — emails sign-in OTP codes (domain nemoapps.xyz). Without the key
      # the code is returned as dev_code; with it, the code is emailed only.
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        value: Nemo Anki <noreply@nemoapps.xyz>
      # Cloudflare R2 (media: book + per-lesson PDFs). When all are set,
      # settings.py serves uploads from R2 and file .url is the public R2 URL —
      # required in prod so lesson PDFs load from the Vercel frontend.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
      - key: R2_LOCATION_PREFIX
        value: ""
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Web Push — notifies staff of new support messages. VAPID_PUBLIC_KEY
      # must match the frontend's VITE_VAPID_PUBLIC_KEY below (same keypair).
      # Unset here → push sends are silently skipped, not an error.
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT_EMAIL
        value: admin@nemoapps.xyz
      # Telegram — posts events (new support messages, new signups, ...)
      # into the team's group. Unset here → skipped, not an error.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Frontend SPA — moved off Vercel (geo-blocked in some regions) onto Render
  # so it's reachable everywhere the backend is. Static Sites are free and
  # served from Render's CDN (no cold start). Calls the backend cross-origin
  # via VITE_API_URL, so the new origin is whitelisted in the backend's
  # CORS_ALLOWED_ORIGINS above.
  - type: web
    name: nemo-anki-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # Canonical user-facing domain. DNS: a CNAME record anki -> the service's
    # onrender.com host, kept DNS-only (not Cloudflare-proxied) so Render
    # manages the TLS cert directly. Render provisions the cert once the
    # blueprint is applied and DNS resolves.
    domains:
      - anki.nemoapps.xyz
    # SPA fallback: serve index.html for client-side routes. Render serves a
    # real built file first when one exists at the path, so hashed assets and
    # the PWA files (sw.js, manifest.webmanifest, icons) are unaffected.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the bundle at build time. The API client reads
      # import.meta.env.VITE_API_URL (see frontend/src/auth/api.ts) and prefixes
      # every request path, so this must be the backend origin without a
      # trailing "/api" (paths already start with /api).
      - key: VITE_API_URL
        value: https://nemo-anki-backend.onrender.com
      # Web Push public key — not secret, but sync: false anyway so it's set
      # once alongside the backend's matching VAPID_PUBLIC_KEY and stays in
      # sync (must be the exact same keypair on both services).
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
