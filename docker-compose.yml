services:
  db:
    image: postgres:16-alpine
    container_name: nemo-anki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nemo_anki}
      POSTGRES_USER: ${POSTGRES_USER:-nemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5436 -> container 5432 (avoids clash with nemo-gardening 5433,
      # soroush-mehr 5434, nemo-map 5435).
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nemo} -d ${POSTGRES_DB:-nemo_anki}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: nemo-anki-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py makemigrations accounts decks cards imports books subscriptions placement notifications reels &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-nemo_anki}
      POSTGRES_USER: ${POSTGRES_USER:-nemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemo}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:5176,http://127.0.0.1:5176
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT_EMAIL: ${VAPID_SUBJECT_EMAIL:-support@nemoapps.xyz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Reels (apps.reels). Unset APIFY_TOKEN leaves the scraping side inert;
      # REELS_SCRAPING_ENABLED unset means only the admin's "Fetch now" spends.
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_REEL_ACTOR: ${APIFY_REEL_ACTOR:-apify/instagram-reel-scraper}
      REELS_RATE_PER_1000: ${REELS_RATE_PER_1000:-2.60}
      REELS_SCRAPING_ENABLED: ${REELS_SCRAPING_ENABLED:-}
      REELS_MONTHLY_BUDGET_USD: ${REELS_MONTHLY_BUDGET_USD:-5.00}
      REELS_RETENTION_DAYS: ${REELS_RETENTION_DAYS:-0}
      REELS_BUDGET_ALERT_PCT: ${REELS_BUDGET_ALERT_PCT:-50,80,100}
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      # Host 8004 -> container 8000 (avoids clash with the sibling backends).
      - "8004:8000"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: nemo-anki-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  celery-worker:
    build: ./backend
    container_name: nemo-anki-celery-worker
    restart: unless-stopped
    command: celery -A core worker -l info
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-nemo_anki}
      POSTGRES_USER: ${POSTGRES_USER:-nemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemo}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT_EMAIL: ${VAPID_SUBJECT_EMAIL:-support@nemoapps.xyz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Reels (apps.reels). Unset APIFY_TOKEN leaves the scraping side inert;
      # REELS_SCRAPING_ENABLED unset means only the admin's "Fetch now" spends.
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_REEL_ACTOR: ${APIFY_REEL_ACTOR:-apify/instagram-reel-scraper}
      REELS_RATE_PER_1000: ${REELS_RATE_PER_1000:-2.60}
      REELS_SCRAPING_ENABLED: ${REELS_SCRAPING_ENABLED:-}
      REELS_MONTHLY_BUDGET_USD: ${REELS_MONTHLY_BUDGET_USD:-5.00}
      REELS_RETENTION_DAYS: ${REELS_RETENTION_DAYS:-0}
      REELS_BUDGET_ALERT_PCT: ${REELS_BUDGET_ALERT_PCT:-50,80,100}
    volumes:
      - ./backend:/app
      # Reel media is written by the ingest task; without this the worker
      # writes into its own container and the web service 404s on it.
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    container_name: nemo-anki-celery-beat
    restart: unless-stopped
    command: celery -A core beat -l info
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-nemo_anki}
      POSTGRES_USER: ${POSTGRES_USER:-nemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemo}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT_EMAIL: ${VAPID_SUBJECT_EMAIL:-support@nemoapps.xyz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Reels (apps.reels). Unset APIFY_TOKEN leaves the scraping side inert;
      # REELS_SCRAPING_ENABLED unset means only the admin's "Fetch now" spends.
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_REEL_ACTOR: ${APIFY_REEL_ACTOR:-apify/instagram-reel-scraper}
      REELS_RATE_PER_1000: ${REELS_RATE_PER_1000:-2.60}
      REELS_SCRAPING_ENABLED: ${REELS_SCRAPING_ENABLED:-}
      REELS_MONTHLY_BUDGET_USD: ${REELS_MONTHLY_BUDGET_USD:-5.00}
      REELS_RETENTION_DAYS: ${REELS_RETENTION_DAYS:-0}
      REELS_BUDGET_ALERT_PCT: ${REELS_BUDGET_ALERT_PCT:-50,80,100}
    volumes:
      - ./backend:/app
      # Reel media is written by the ingest task; without this the worker
      # writes into its own container and the web service 404s on it.
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram-poller:
    build: ./backend
    container_name: nemo-anki-telegram-poller
    restart: unless-stopped
    command: python manage.py poll_telegram_updates
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-nemo_anki}
      POSTGRES_USER: ${POSTGRES_USER:-nemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemo}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: nemo-anki-frontend
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      # Host 5176 -> container 5173.
      - "5176:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  frontend_node_modules:
