name: CI

# Runs on every pull request and on pushes to main, so a change is validated
# before (and as) Render auto-deploys it. Render deploys main automatically on
# merge; this is the safety gate that catches a broken PR first.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nemo_anki
          POSTGRES_USER: nemo
          POSTGRES_PASSWORD: nemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nemo -d nemo_anki"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nemo_anki
      POSTGRES_USER: nemo
      POSTGRES_PASSWORD: nemo
      DJANGO_SECRET_KEY: ci-not-a-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity=1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check & build
        run: npm run build
