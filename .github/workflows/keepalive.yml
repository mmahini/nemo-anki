# Hourly wake-up for the free-tier Render backend. It does NOT keep the
# instance awake continuously (it sleeps after ~15 idle minutes) — it
# guarantees at least one awake window per hour, in which the in-process
# study-reminder ticker (backend/apps/notifications/ticker.py) runs and
# catches up any reminder from the past REMINDER_CATCHUP window (see
# apps/notifications/tasks.py) — so reminders can arrive up to ~an hour
# late on a quiet instance, but never silently drop. The Telegram webhook
# doesn't need this at all: its own request wakes the instance.
name: keep-backend-awake

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS -o /dev/null -w "health: %{http_code}\n" --max-time 90 \
            https://nemo-anki-backend.onrender.com/api/health/
