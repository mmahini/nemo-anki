<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-64x64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything other than 0. Without it the layout stops at the "safe" box
         and every safe-area rule in styles.css is dead, so bottom bars sit
         above a grey strip on a notched iPhone and the home indicator can
         overlap taps. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4c6ef5" />
    <meta name="description" content="Nemo Anki — spaced-repetition flashcards for German and English." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nemo Anki" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700,800&display=swap"
    />
    <title>Nemo Anki — learn words that stick</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
